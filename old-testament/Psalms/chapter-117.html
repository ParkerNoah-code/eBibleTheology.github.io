<h1>Psalm 117</h1>

<nav><a href="chapter-116.html">Previous</a> | <a href="index.html">Chapters</a> | <a href="chapter-118.html">Next</a></nav>

<p class="poetry"><sup id="V1">1</sup> Praise the LORD, all you nations!</p>
<p class="poetry indent">Extol him, all you peoples!</p>
<p class="poetry"><sup id="V2">2</sup> For his loving kindness is great toward us.</p>
<p class="poetry indent">The LORD’s faithfulness endures forever.</p>
<p class="poetry">Praise the LORD!</p>
